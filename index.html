<!doctype html>
<!-- JavaScript 실행 전 기본값은 기준 언어(en). 실행 후 I18nProvider가 현재 언어로 바꾼다. (ADR-0002) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play Sudoku in your browser, no sign-up required." />
    <title>Sudoum Sudoku — Brain-training Sudoku</title>
    <!-- 저장된 화면 테마를 CSS·JavaScript보다 먼저 적용해 다른 테마가 잠깐 보이는 깜빡임을 막는다. (game/persistence.ts THEME_KEY) -->
    <script>
      try {
        var theme = localStorage.getItem('sudoum.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
